name: ci
on:
  push:
    branches: [main]
    # A commit that only writes the run log changes nothing these jobs check. The
    # pull_request trigger has no filter: the required checks must report on every one.
    paths-ignore:
      - "runlog/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The repository is public, so anyone can open a pull request from a fork. No job needs to
# write, and no job uses a secret: the token is read-only.
permissions:
  contents: read

# A new push to a pull request replaces its run. Runs on main finish, so that every commit
# there, each merged pull request among them, keeps its own result. Their group is the
# commit, not the branch: a group holds one waiting run, and a newer one would replace it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Line tables keep file and line in backtraces and leave out the rest of the debug info, which
# the workspace crates would otherwise write and link on every run.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    # The randomized tests run with the quick seed budget here and with every seed in
    # nightly.yml. See "Seed budget" in PORTING.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-console-on:
    # The Python console embeds CPython, so it is a cargo feature that the rust job builds
    # without. This job lints the server with the feature and runs the server's whole test
    # suite, on the oldest and the newest Python the project supports (docs/CONSOLE.md,
    # "Build and CI"). It installs no packages and names no environment: these tests may
    # import only the standard library. What needs numpy or pandas is a script scenario,
    # which oracle-replay runs in a pinned environment; the tests of completion that need
    # jedi do not run here (they say so and pass) and run in oracle-replay.
    name: python-console (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Let the test binary find the libpython it is linked against
        run: |
          libdir="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "LD_LIBRARY_PATH=$libdir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # the build of PyO3 and of the server differs per Python
          key: python-${{ matrix.python }}
      - run: cargo clippy -p oxhaven-server --features python --all-targets -- -D warnings
      - run: cargo test -p oxhaven-server --features python

  python-console:
    # One result under the name this job had before it ran on several Pythons, for whatever
    # requires that name: it passes when every Python above passed.
    needs: python-console-on
    # Not `always()`: a cancelled run must not leave a failed check behind on the commit.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every Python passed
        env:
          RESULT: ${{ needs.python-console-on.result }}
        run: test "$RESULT" = success

  oracle-replay:
    # Builds the server with its Python console, starts it, and compares it with the recorded
    # Java results (table scenarios and script scenarios) and the client smoke checks, against
    # oracle/replay-baseline.json. See oracle/README.md. Its environment has jedi, so the
    # tests of completion in the console run here too, and must not be skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # This Python runs the harness (oracle/.venv is made from it) and is the one the
      # server embeds: ci-replay.sh builds with `--features python`, PyO3 takes `python3`
      # from PATH, and the script puts its libpython on the server's library path. The
      # server's packages are those of oracle/.venv (VIRTUAL_ENV below), not whatever the
      # runner's Python has: the versions the recordings were made with, here as on a
      # developer's machine. See docs/CONSOLE.md, "The Python environment".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: oracle/requirements-replay.txt
      - name: Install the harness's replay environment
        run: |
          python -m venv oracle/.venv
          oracle/.venv/bin/pip install -r oracle/requirements-replay.txt
      - name: Tests of the harness
        working-directory: oracle
        run: .venv/bin/python -m pytest -q
      - name: Replay the recorded Java results and run the client smokes
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/oracle/.venv
          ORACLE_GATE_OUT: ${{ runner.temp }}/oracle-replay
          ORACLE_GATE_TIMEOUT: "300"
        run: oracle/bin/ci-replay.sh
      - name: Completion in the console, answered by jedi
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/oracle/.venv
          OXHAVEN_REQUIRE_JEDI: "1"
        run: |
          libdir="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" \
            cargo test --locked -p oxhaven-server --features python --lib -- console::python::completer_tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: oracle-replay-report
          path: ${{ runner.temp }}/oracle-replay
          if-no-files-found: warn

  rules:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protected paths need the oracle-change label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # oracle/replay-baseline.json is not in this list: the next step holds its rule.
          changed=$(git diff --name-only "$BASE"...HEAD -- oracle PARITY.md crates/oxhaven-contracts \
            ':(exclude)oracle/replay-baseline.json')
          if [ -n "$changed" ] && ! echo "$LABELS" | grep -q '"oracle-change"'; then
            echo "These protected files changed without the oracle-change label:"
            echo "$changed"
            exit 1
          fi
      - name: The replay baseline only gets stricter without the oracle-change label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if echo "$LABELS" | grep -q '"oracle-change"'; then
            echo "The pull request has the oracle-change label."
            exit 0
          fi
          oracle/bin/check-baseline-change.sh "$BASE"
      - name: Commit subjects are scope-prefixed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-commit-subjects.sh "$BASE"..HEAD
