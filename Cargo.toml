[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"

# Protocol stack. tonic, tonic-prost, prost and prost-types must stay on the 0.14 line together:
# arrow-flight 60 is generated against that line, and its message types are used directly in the
# BrowserFlight service stubs. Every arrow-* crate must share one major version.
[workspace.dependencies]
arrow = "60.1.0"
arrow-flight = "60.1.0"
base64 = "0.22.1"
bytes = "1"
flatbuffers = "25.12.19"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
h2 = "0.4"
http = "1.5"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "server-graceful", "tokio"] }
libc = "0.2"
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.6"
protox = "0.10.0"
# Embeds CPython for the Python console; only built with the `python` feature of the server.
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
regex = "1"
serde_json = "1"
tokio = { version = "1.54", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
