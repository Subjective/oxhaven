[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

# Protocol stack. tonic, tonic-prost, prost and prost-types must stay on the 0.14 line together:
# arrow-flight 60 is generated against that line, and its message types are used directly in the
# BrowserFlight service stubs. Every arrow-* crate must share one major version.
[workspace.dependencies]
# Fixed-seed hashing of join keys and of the engine's group key tables (MIT OR Apache-2.0);
# arrow already brings it.
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
arrow = "60.1.0"
arrow-flight = "60.1.0"
base64 = "0.22.1"
bytes = "1"
# Dates for time literals with a time zone; arrow already brings chrono.
chrono = { version = "0.4", default-features = false }
# The time zone rules of the IANA database, compiled in: Java carries its own copy too.
chrono-tz = { version = "0.10", default-features = false }
flatbuffers = "25.12.19"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
h2 = "0.4"
# The hash table of join keys, hashed and compared by this workspace's code; arrow already
# brings it.
http = "1.5"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "server-graceful", "tokio"] }
libc = "0.2"
# The server binary's allocator (MIT), built from its bundled C source; only the `mimalloc`
# feature of oxhaven-server uses it (docs/BENCHMARK.md, "After task 9.13").
mimalloc = { version = "0.1.52", default-features = false }
# Reads Parquet files into Arrow arrays; the same major version as arrow. `snap` and `zstd`
# bring BSD-3-Clause crates, and zstd-sys is also BSD-2-Clause: the owner accepted both for
# these Parquet codecs only (PORTING.md, "Dependencies"). `brotli` stays off for parity,
# not for its licence (docs/STORAGE.md, "Dependencies").
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "flate2", "flate2-rust_backend", "lz4", "snap", "zstd"] }
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.6"
protox = "0.10.0"
# Embeds CPython for the Python console; only built with the `python` feature of the server.
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
regex = "1"
serde_json = "1"
tokio = { version = "1.54", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
