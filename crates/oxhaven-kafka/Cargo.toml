[package]
name = "oxhaven-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow.workspace = true
bytes.workspace = true
oxhaven-column = { path = "../oxhaven-column" }
oxhaven-contracts = { path = "../oxhaven-contracts" }
oxhaven-engine = { path = "../oxhaven-engine" }
# `DateTimeUtils#parseInstant` of the text in a JSON `Instant` column.
oxhaven-expr = { path = "../oxhaven-expr" }
# Protobuf descriptors, and `.proto` text read into them, for a Protobuf spec.
prost-reflect.workspace = true
protox.workspace = true
# librdkafka, compiled from the sources `rdkafka-sys` carries, with its own snappy and lz4,
# Zstandard from `zstd-sys`, zlib from `libz-sys` and the system's OpenSSL. No Cyrus SASL
# or curl: docs/KAFKA.md, "The client library", has the licences and why each feature is
# on or off.
rdkafka = { version = "0.39", default-features = false, features = ["zstd", "libz-static", "ssl"] }
# The error events librdkafka reports, which are logged.
tracing.workspace = true

[dev-dependencies]
oxhaven-testkit = { path = "../oxhaven-testkit" }
# Prints librdkafka's logs and error events with a failing test's output.
tracing-subscriber.workspace = true
